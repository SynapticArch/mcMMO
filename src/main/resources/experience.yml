#
#  经验公式设置
###
Experience_Formula:
    # 有效值为：LINEAR 和 EXPONENTIAL
    # 如果输入了无效值，将重置为默认设置，即 LINEAR
    # LINEAR:      base + (level * multiplier)
    # EXPONENTIAL: multiplier * level ^ exponent + base
    Curve: LINEAR

    # 如果输入了无效值，mcMMO 将无法启动并在控制台中打印错误
    Linear_Values:
        base: 1020
        multiplier: 20
    Exponential_Values:
        multiplier: 0.1
        exponent: 1.80
        base: 2000

    # 累积经验曲线将使用玩家的能力等级而不是他们的技能等级，
    # 具有高能力等级的玩家将需要获得更多的经验才能达到每个技能的下一个等级。
    Cumulative_Curve: false

    # 每个技能获得的经验将乘以此值。默认为 1.0，2.0 表示获得两倍的经验
    Multiplier:
        Global: 1.0
        PVP: 1.0

    # 从未自然生成的生物获得的经验将乘以此值。默认为 0。
    Eggs:
        Multiplier: 0
    Mobspawners:
        Multiplier: 0
    Nether_Portal:
        Multiplier: 0
    Breeding:
        Multiplier: 1.0

    # Experience gained will get multiplied by these values. 1.0 by default, 0.5 means half XP gained. This happens right before multiplying the XP by the global multiplier.
    Skill_Multiplier:
        Maces: 1.0
        Crossbows: 1.0
        Tridents: 1.0
        Swords: 1.0
        Taming: 1.0
        Acrobatics: 1.0
        Excavation: 1.0
        Herbalism: 1.0
        Unarmed: 1.0
        Woodcutting: 1.0
        Mining: 1.0
        Archery: 1.0
        Axes: 1.0
        Repair: 1.0
        Fishing: 1.0
        Alchemy: 1.0

    # 有权限 mcmmo.perks.xp.customboost.<skillname> 的玩家获得的 XP 将乘以 1.25
    Custom_XP_Perk:
        Boost: 1.25

#
# 减少回报设置
###
Diminished_Returns:
    # 这是玩家在达到时间阈值后获得的最小经验量（这是为了避免对玩家获得经验惩罚太严重）
    ## 值为 1 表示玩家获得 FULL XP，这与减少回报的目的相悖，默认值为 0.05（最低 5% 经验）
    ### 将此值设置为 0 将其关闭
    Guaranteed_Minimum_Percentage: 0.05
    Enabled: false

    # 限制玩家可以获得的经验量：
    # 时间间隔（以分钟为单位）的阈值（经验量）
    Threshold:
        Swords: 20000
        Taming: 20000
        Acrobatics: 20000
        Excavation: 20000
        Herbalism: 20000
        Unarmed: 20000
        Woodcutting: 20000
        Mining: 20000
        Archery: 20000
        Axes: 20000
        Repair: 20000
        Fishing: 20000
        Alchemy: 20000
        Crossbows: 20000
        Tridents: 20000
        Maces: 20000

    Time_Interval: 10

#
#  通过 '/mcconvert experience' 进行 XP 转换的设置
###
Conversion:
    # 旧经验将除以此修饰符
    Exp_Modifier: 1

